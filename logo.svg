<svg
  id="homepage-logo"
  aria-labelledby="logo-svg-title logo-svg-desc"
  width="240"
  height="240"
  viewBox="-5 -5 61 63"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <title id="logo-svg-title">The Roc architect logo</title>
  <desc id="logo-svg-desc">
    The Roc origami bird drawn as an architectural blueprint
  </desc>

  <defs>
    <!-- Blueprint grid -->
    <pattern
      id="small-grid"
      width="2"
      height="2"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M 2 0 L 0 0 0 2"
        fill="none"
        stroke="currentColor"
        stroke-opacity="0.08"
        stroke-width="0.12"
      />
    </pattern>

    <pattern
      id="grid"
      width="10"
      height="10"
      patternUnits="userSpaceOnUse"
    >
      <rect width="10" height="10" fill="url(#small-grid)" />
      <path
        d="M 10 0 L 0 0 0 10"
        fill="none"
        stroke="currentColor"
        stroke-opacity="0.18"
        stroke-width="0.18"
      />
    </pattern>
  </defs>

  <!-- Drawing-board grid -->
  <rect
    x="-5"
    y="-5"
    width="61"
    height="63"
    fill="url(#grid)"
    class="blueprint-grid"
  />

  <!-- Construction / projection lines -->
  <g
    class="construction-lines"
    stroke="currentColor"
    stroke-width="0.22"
    stroke-dasharray="1.2 1.2"
    opacity="0.45"
  >
    <path d="M23.6751 -4 V57" />
    <path d="M-4 22.7086 H55" />

    <path d="M17.655 53 V56" />
    <path d="M27.4527 45.2132 V56" />
    <path d="M17.655 55 H27.4527" />

    <path d="M45 -1 V22" />
    <path d="M23.8834 3.21052 H49" />
  </g>

  <!-- Dimension ticks -->
  <g
    class="dimension-lines"
    stroke="currentColor"
    stroke-width="0.35"
    opacity="0.7"
  >
    <path d="M17.655 54.2 l1.2 1.6" />
    <path d="M26.2527 54.2 l1.2 1.6" />

    <path d="M44.2 3.21052 l1.6 1.2" />
    <path d="M44.2 22 l1.6 1.2" />
  </g>

  <!-- Roc bird -->
  <g
    class="roc-bird"
    stroke="currentColor"
    stroke-width="0.45"
    stroke-linejoin="round"
  >
    <path
      d="M23.6751 22.7086
         L17.655 53
         L27.4527 45.2132
         L26.4673 39.3424
         Z"
      class="logo-dark"
      fill="currentColor"
      fill-opacity="0.8"
    />

    <path
      d="M37.2438 19.0101
         L44.0315 26.3689
         L45 22
         L45.9665 16.6324
         Z"
      class="logo-light"
      fill="currentColor"
      fill-opacity="0.18"
    />

    <path
      d="M23.8834 3.21052
         L23.6751 22.7086
         L23.8834 3.21052
         Z"
      class="logo-light"
      fill="currentColor"
      fill-opacity="0.18"
    />

    <path
      d="M44.0315 26.3689
         L23.6751 22.7086
         L26.4673 39.3424
         Z"
      class="logo-light"
      fill="currentColor"
      fill-opacity="0.18"
    />

    <path
      d="M50.5 22
         L45.9665 16.6324
         L45 22
         Z"
      class="logo-dark"
      fill="currentColor"
      fill-opacity="0.8"
    />

    <path
      d="M23.6751 22.7086
         L44.0315 26.3689
         L37.2438 19.0101
         L23.8834 3.21052
         Z"
      class="logo-dark"
      fill="currentColor"
      fill-opacity="0.8"
    />
  </g>

  <!-- Vertex / drafting points -->
  <g class="drafting-points" fill="currentColor">
    <circle cx="23.6751" cy="22.7086" r="0.65" />
    <circle cx="23.8834" cy="3.21052" r="0.45" />
    <circle cx="44.0315" cy="26.3689" r="0.45" />
    <circle cx="45" cy="22" r="0.45" />
    <circle cx="17.655" cy="53" r="0.45" />
  </g>

  <!-- Architectural callout -->
  <g
    class="architect-callout"
    stroke="currentColor"
    fill="none"
    stroke-width="0.3"
    opacity="0.65"
  >
    <circle cx="8" cy="8" r="3.2" />
    <path d="M8 4.8 V11.2" />
    <path d="M6.5 7 L8 4.8 L9.5 7" />
  </g>
</svg>
